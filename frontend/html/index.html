<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Microservices Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>

  <header>
    <div class="header-left">
      <h1>Microservices System Dashboard</h1>
      <p>
        Distributed SRE Infrastructure • Docker • RabbitMQ • Prometheus • Grafana
      </p>
    </div>

    <div class="header-status">
      <div class="status-pill">
        Environment: Development
      </div>

      <button class="secondary" onclick="localStorage.clear()">
        Clear Session
      </button>
    </div>
  </header>

  <main>

    <div class="grid">

      <!-- AUTH -->
      <section class="card">
        <h2>🔐 Authentication Service</h2>

        <label>Register</label>

        <input id="reg_user" placeholder="Username" />

        <input
          id="reg_pass"
          type="password"
          placeholder="Password"
        />

        <div class="button-row">
          <button onclick="register()">
            Register
          </button>
        </div>

        <hr />

        <label>Login</label>

        <input id="log_user" placeholder="Username" />

        <input
          id="log_pass"
          type="password"
          placeholder="Password"
        />

        <div class="button-row">
          <button onclick="login()">
            Login
          </button>
        </div>
      </section>

      <!-- PRODUCTS -->
      <section class="card">
        <h2>📦 Product Service</h2>

        <label>Product Name</label>

        <input id="p_name" placeholder="MacBook Pro" />

        <label>Price</label>

        <input id="p_price" placeholder="2500" />

        <label>Stock</label>

        <input id="p_stock" placeholder="20" />

        <div class="button-row">
          <button onclick="createProduct()">
            Create Product
          </button>

          <button
            class="secondary"
            onclick="getProducts()"
          >
            Get Products
          </button>
        </div>
      </section>

      <!-- ORDERS -->
      <section class="card">
        <h2>🛒 Order Service</h2>

        <label>Product ID</label>

        <input
          id="product_id"
          placeholder="1"
        />

        <label>Amount</label>

        <input
          id="amount"
          placeholder="2500"
        />

        <div class="button-row">
          <button onclick="createOrder()">
            Create Order
          </button>

          <button
            class="secondary"
            onclick="getOrders()"
          >
            Get Orders
          </button>
        </div>
      </section>

<!-- PAYMENTS -->
<section class="card">

  <h2>💳 Payment Service</h2>

  <label>User ID</label>

  <input
    id="payment_user_id"
    placeholder="1"
  />

  <label>Order ID</label>

  <input
    id="payment_order_id"
    placeholder="101"
  />

  <label>Amount</label>

  <input
    id="payment_amount"
    placeholder="100"
  />

  <div class="button-row">

    <button onclick="createPayment()">
      Process Payment
    </button>

  </div>

</section>

      <!-- PROFILE -->
      <section class="card">
        <h2>👤 User Profile Service</h2>

        <label>Create / Update Profile</label>

        <input
          id="profile_user_id"
          placeholder="User ID"
        />

        <input
          id="profile_email"
          placeholder="Email"
        />

        <input
          id="profile_phone"
          placeholder="Phone"
        />

        <input
          id="profile_address"
          placeholder="Address"
        />

        <div class="button-row">
          <button onclick="createProfile()">
            Create Profile
          </button>

          <button
            class="secondary"
            onclick="updateProfile()"
          >
            Update Profile
          </button>
        </div>

        <hr />

        <label>Get Profile</label>

        <input
          id="profile_get_user_id"
          placeholder="User ID"
        />

        <div class="button-row">
          <button
            class="secondary"
            onclick="getProfile()"
          >
            Get Profile
          </button>
        </div>
      </section>

      <!-- NOTIFICATIONS -->
      <!-- <section class="card">
        <h2>📨 Notification Service</h2>

        <label>User ID</label>

        <input
          id="notification_user_id"
          placeholder="1"
        />

        <div class="button-row">
          <button onclick="getNotifications()">
            Get Notifications
          </button>
        </div>
      </section> -->

      <!-- OUTPUT -->
      <section class="card full-width">
        <h2>📄 API Response</h2>

        <pre id="output">
Ready...
        </pre>
      </section>

    </div>

  </main>

  <script src="app.js"></script>

</body>

 
</html>
