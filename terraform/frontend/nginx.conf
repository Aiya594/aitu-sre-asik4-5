events {}

http {

  server {
    listen 80;

    location / {
      root /usr/share/nginx/html;
      index index.html;
    }

    location /auth/ {
      proxy_pass http://auth-service:8080/;
    }

    location /orders/ {
      proxy_pass http://order-service:8081/;
    }

    location /products/ {
      proxy_pass http://product-service:8082/;
    }
  }
}