<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Microservices Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>Microservices System Dashboard</h1>

<div class="container">

    <!-- AUTH -->
    <div class="card">
        <h2>Auth Service</h2>

        <input id="reg_user" placeholder="Register username" />
        <input id="reg_pass" type="password" placeholder="Register password" />
        <button onclick="register()">Register</button>

        <hr>

        <input id="log_user" placeholder="Login username" />
        <input id="log_pass" type="password" placeholder="Login password" />
        <button onclick="login()">Login</button>
    </div>

    <!-- PRODUCTS -->
    <div class="card">
        <h2>Product Service</h2>

        <input id="p_name" placeholder="Product name" />
        <input id="p_price" placeholder="Price" />
        <input id="p_stock" placeholder="Stock" />

        <button onclick="createProduct()">Create Product</button>
        <button onclick="getProducts()">Get Products</button>
    </div>

    <!-- ORDERS -->
    <div class="card">
        <h2>Order Service</h2>

        <input id="product" placeholder="Product name" />
        <input id="amount" placeholder="Amount" />

        <button onclick="createOrder()">Create Order</button>
        <button onclick="getOrders()">Get Orders</button>
    </div>

</div>

<!-- OUTPUT -->
<div class="output">
    <h2>Response</h2>
    <pre id="output"></pre>
</div>

<script src="app.js"></script>

</body>
</html>
