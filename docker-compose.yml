version: "3.9"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "${FRONTEND_PORT}:5000"
    volumes:
      - ./terraform/frontend/nginx.conf:/etc/nginx/nginx.conf
      - ./terraform/frontend/html:/usr/share/nginx/html
    depends_on:
      - auth-service
      - order-service
      - product-service
    networks:
      - app-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports: 
      - "${AUTH_SERVICE_PORT}:8080"
    env_file:
      - ./auth-service/.env
    environment:
      - DB_HOST=${postgres}
      - DB_USER=${admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_MODE=${DB_MODE}
      - DB_PORT=${DB_PORT}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://auth-service:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - postgres
    networks:
      - app-network

  product-service:
    build: ./product-service
    container_name: product-service
    ports: 
      - "${PRODUCT_SERVICE_PORT}:8082"
    env_file:
      - ./product-service/.env
    environment:
      - DB_HOST=${postgres}
      - DB_USER=${admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_MODE=${DB_MODE}
      - DB_PORT=${DB_PORT}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://product-service:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - postgres
    networks:
      - app-network

  order-service:
    build: ./order-service
    container_name: order-service
    ports: 
      - "${ORDER_SERVICE_PORT}:8081"
    env_file:
      - ./order-service/.env
    environment:
      - DB_HOST=${postgres}
      - DB_USER=${admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_MODE=${DB_MODE}
      - DB_PORT=${DB_PORT}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://order-service:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - postgres
      - product-service
    networks:
      - app-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./terraform/db_init:/docker-entrypoint-initdb.d
    networks:
      - app-network

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./terraform/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - auth-service
      - order-service
      - product-service
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: