version: "3.9"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "${FRONTEND_PORT}:5000"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/html:/usr/share/nginx/html
    depends_on:
      - auth-service
      - order-service
      - product-service
    networks:
      - app-network
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports: 
      - "${AUTH_SERVICE_PORT}:8080"
    env_file:
      - ./auth-service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_MODE=${DB_MODE}
      - DB_PORT=${DB_PORT}
    healthcheck:
      test: ["CMD", "curl", "-f",  "http://auth-service:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  product-service:
    build: ./product-service
    container_name: product-service
    ports: 
      - "${PRODUCT_SERVICE_PORT}:8082"
    env_file:
      - ./product-service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_MODE=${DB_MODE}
      - DB_PORT=${DB_PORT}
    healthcheck:
      test: ["CMD", "curl", "-f",  "http://product-service:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT}:8083"
    env_file:
      - ./payment-service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_MODE=${DB_MODE}
      - DB_PORT=${DB_PORT}
    depends_on:
      - postgres 
    networks:
      - app-network
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: order-service
    ports: 
      - "${ORDER_SERVICE_PORT}:8081"
    env_file:
      - ./order-service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_MODE=${DB_MODE}
      - DB_PORT=${DB_PORT}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL}
      - RABBITMQ_URL=${RABBIT_MQ_URL}
    healthcheck:
      test: ["CMD", "curl", "-f",  "http://order-service:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - postgres
      - product-service
    networks:
      - app-network
    restart: unless-stopped

  profile-service:
    build: ./user-profile-service
    container_name: profile-service
    ports:
      - "${USER_SERVICE_PORT}:8085"
    env_file:
      - ./user-profile-service/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_MODE=${DB_MODE}
      - DB_PORT=${DB_PORT}
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./db_init:/docker-entrypoint-initdb.d
    networks:
      - app-network

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
    depends_on:
      - auth-service
      - order-service
      - product-service
      - payment-service
      - profile-service
    networks:
      - app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
    networks:
      - app-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: